<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🐱 Cat Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #fff8f0;
      --surface: #ffffff;
      --border:  #f0e6d8;
      --accent:  #ff7043;
      --accent2: #ffb347;
      --pink:    #ff6b9d;
      --green:   #4caf50;
      --text:    #2d2013;
      --muted:   #a08060;
      --radius:  20px;
      --shadow:  0 4px 24px rgba(255,112,67,0.10);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Quicksand', sans-serif;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    /* Decorative paw prints background */
    body::before {
      content: '🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾';
      position: fixed;
      top: 0; left: 0; right: 0;
      font-size: 60px;
      opacity: 0.03;
      letter-spacing: 40px;
      line-height: 120px;
      word-break: break-all;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 28px;
      animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes bounceIn {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .header h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 40px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat-card .num {
      font-family: 'Nunito', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--accent);
    }

    .stat-card .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 2px;
    }

    /* Search + Filter row */
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .search-row input {
      flex: 1;
      min-width: 180px;
      padding: 12px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
      box-shadow: var(--shadow);
    }

    .search-row input:focus { border-color: var(--accent); }
    .search-row input::placeholder { color: var(--muted); }

    /* Breed filter pills */
    .breed-filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .pill {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: 'Quicksand', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .pill:hover { border-color: var(--accent); color: var(--accent); }
    .pill.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Add form */
    .add-form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .add-form h2 {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 16px;
      color: var(--text);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full { grid-column: span 2; }

    .form-group label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus { border-color: var(--accent); }

    .photo-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Buttons */
    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: var(--radius);
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--pink));
      color: white;
      box-shadow: 0 4px 16px rgba(255,112,67,0.3);
    }

    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-danger {
      background: rgba(255,107,157,0.1);
      color: var(--pink);
      border: 1px solid rgba(255,107,157,0.2);
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 10px;
    }

    .btn-danger:hover { background: rgba(255,107,157,0.2); }

    .btn-secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    /* Cat cards grid */
    .cats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .cat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.2s, box-shadow 0.2s;
      animation: popCard 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    @keyframes popCard {
      from { opacity: 0; transform: scale(0.9); }
      to   { opacity: 1; transform: scale(1); }
    }

    .cat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(255,112,67,0.15);
    }

    .cat-photo {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: linear-gradient(135deg, #ffe0d0, #ffd0e8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .cat-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cat-info {
      padding: 14px;
    }

    .cat-name {
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    .cat-breed {
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }

    .cat-age {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .cat-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 10px;
    }

    /* Empty state */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty .emoji { font-size: 60px; margin-bottom: 12px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      box-shadow: var(--shadow);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--pink); color: var(--pink); }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 11px;
      color: var(--muted);
    }

    .footer span { color: var(--accent); font-weight: 700; }

    /* Mobile */
    @media (max-width: 600px) {
      .header h1 { font-size: 28px; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: span 1; }
      .cats-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
      .cat-photo { height: 140px; }
      .stats { gap: 8px; }
      .stat-card .num { font-size: 22px; }
      .toast { left: 12px; right: 12px; bottom: 12px; text-align: center; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <h1>🐱 Cat Store</h1>
    <p>Find your perfect feline companion</p>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="num" id="totalCats">0</div>
      <div class="label">Total Cats</div>
    </div>
    <div class="stat-card">
      <div class="num" id="totalBreeds">0</div>
      <div class="label">Breeds</div>
    </div>
  </div>

  <!-- Search -->
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="🔍  Search by name or breed..." oninput="searchCats()"/>
    <button class="btn btn-secondary" onclick="resetFilter()">All Cats</button>
  </div>

  <!-- Breed filter pills -->
  <div class="breed-filters" id="breedFilters"></div>

  <!-- CSV Upload -->
  <div class="add-form" style="margin-bottom:16px;">
    <h2>📂 Bulk Upload via CSV</h2>
    <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">Upload a CSV file with columns: <strong>name, breed, age, photoUrl</strong></p>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <input type="file" id="csvFile" accept=".csv" style="flex:1; padding:10px; background:var(--bg); border:1px solid var(--border); border-radius:12px; font-family:'Quicksand',sans-serif; font-size:13px; color:var(--text); cursor:pointer;"/>
      <button class="btn btn-primary" onclick="uploadCSV()">Upload CSV</button>
      <button class="btn" style="background:var(--bg); border:1px solid var(--border); color:var(--accent); font-family:'Nunito',sans-serif; font-weight:700;" onclick="downloadSample()">Download Sample</button>
    </div>
    <div id="csvStatus" style="margin-top:10px; font-size:13px; color:var(--muted);"></div>
  </div>

  <!-- Add cat form -->
  <div class="add-form">
    <h2>➕ Add New Cat</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Cat Name</label>
        <input type="text" id="catName" placeholder="e.g. Whiskers"/>
      </div>
      <div class="form-group">
        <label>Breed</label>
        <input type="text" id="catBreed" placeholder="e.g. Persian" oninput="suggestPhoto()"/>
      </div>
      <div class="form-group">
        <label>Age (years)</label>
        <input type="number" id="catAge" placeholder="e.g. 2" min="0" max="30"/>
      </div>
      <div class="form-group">
        <label>Photo URL <span style="color:var(--accent2);">(optional)</span></label>
        <input type="text" id="catPhoto" placeholder="https://... (leave empty to reuse breed photo)"/>
        <span class="photo-note" id="photoNote"></span>
      </div>
    </div>
    <button class="btn btn-primary" onclick="addCat()">🐾 Add Cat</button>
  </div>

  <!-- Cats grid -->
  <div class="section-header" style="margin-bottom:16px;">
    <h2 style="font-family:'Nunito',sans-serif; font-size:20px; font-weight:800;" id="sectionTitle">All Cats</h2>
  </div>
  <div class="cats-grid" id="catsGrid">
    <div class="empty">
      <div class="emoji">🐱</div>
      <p>Loading cats...</p>
    </div>
  </div>

  <div class="footer">
    Created by <span>Azbara</span> · Powered by <span>Spring Boot + MySQL</span>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = '/api/cats';
  let allBreeds = [];

  // ── Load all cats ──────────────────────────────────────
  async function loadCats() {
    try {
      const res  = await fetch(API);
      const cats = await res.json();
      renderCats(cats);
      updateStats(cats);
      loadBreeds();
    } catch {
      showToast('Could not connect to server', 'error');
    }
  }

  // ── Load breed filter pills ────────────────────────────
  async function loadBreeds() {
    try {
      const res    = await fetch(`${API}/breeds`);
      allBreeds    = await res.json();
      const filters = document.getElementById('breedFilters');
      filters.innerHTML = allBreeds.map(b =>
        `<button class="pill" onclick="filterByBreed('${b}')">${b}</button>`
      ).join('');
    } catch {}
  }

  // ── Filter by breed ────────────────────────────────────
  async function filterByBreed(breed) {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('sectionTitle').textContent = `${breed} Cats`;
    document.getElementById('searchInput').value = '';
    try {
      const res  = await fetch(`${API}/breed/${encodeURIComponent(breed)}`);
      const cats = await res.json();
      renderCats(cats);
    } catch {
      showToast('Filter failed', 'error');
    }
  }

  // ── Reset filter ───────────────────────────────────────
  function resetFilter() {
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    document.getElementById('sectionTitle').textContent = 'All Cats';
    document.getElementById('searchInput').value = '';
    loadCats();
  }

  // ── Search cats ────────────────────────────────────────
  async function searchCats() {
    const query = document.getElementById('searchInput').value.trim();
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    if (!query) { loadCats(); return; }
    try {
      const res  = await fetch(`${API}/search?query=${encodeURIComponent(query)}`);
      const cats = await res.json();
      document.getElementById('sectionTitle').textContent = `Results for "${query}"`;
      renderCats(cats);
    } catch {
      showToast('Search failed', 'error');
    }
  }

  // ── Suggest photo for existing breed ──────────────────
  function suggestPhoto() {
    const breed = document.getElementById('catBreed').value.trim();
    const note  = document.getElementById('photoNote');
    if (allBreeds.map(b => b.toLowerCase()).includes(breed.toLowerCase())) {
      note.textContent = '✅ This breed already has a photo — it will be reused automatically!';
      note.style.color = 'var(--green)';
    } else {
      note.textContent = breed ? '📸 New breed — add a photo URL above!' : '';
      note.style.color = 'var(--accent2)';
    }
  }

  // ── Add cat ────────────────────────────────────────────
  async function addCat() {
    const name     = document.getElementById('catName').value.trim();
    const breed    = document.getElementById('catBreed').value.trim();
    const age      = parseInt(document.getElementById('catAge').value);
    const photoUrl = document.getElementById('catPhoto').value.trim();

    if (!name || !breed || isNaN(age)) {
      showToast('Please fill in name, breed and age', 'error');
      return;
    }

    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, breed, age, photoUrl })
      });

      if (res.ok) {
        document.getElementById('catName').value  = '';
        document.getElementById('catBreed').value = '';
        document.getElementById('catAge').value   = '';
        document.getElementById('catPhoto').value = '';
        document.getElementById('photoNote').textContent = '';
        showToast('🐾 Cat added successfully!', 'success');
        loadCats();
      } else {
        showToast('Failed to add cat', 'error');
      }
    } catch {
      showToast('Could not connect to server', 'error');
    }
  }

  // ── Delete cat ─────────────────────────────────────────
  async function deleteCat(id) {
    if (!confirm('Are you sure you want to remove this cat?')) return;
    try {
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
      if (res.ok) {
        showToast('🗑️ Cat removed', 'success');
        loadCats();
      }
    } catch {
      showToast('Could not connect to server', 'error');
    }
  }

  // ── Render cats ────────────────────────────────────────
  function renderCats(cats) {
    const grid = document.getElementById('catsGrid');
    updateStats(cats);

    if (cats.length === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div class="emoji">😿</div>
          <p>No cats found</p>
        </div>`;
      return;
    }

    grid.innerHTML = cats.map(cat => `
      <div class="cat-card">
        <div class="cat-photo">
          ${cat.photoUrl
            ? `<img src="${cat.photoUrl}" alt="${cat.breed}" onerror="this.parentElement.innerHTML='🐱'"/>`
            : '🐱'}
        </div>
        <div class="cat-info">
          <div class="cat-name">${cat.name}</div>
          <div class="cat-breed">🐾 ${cat.breed}</div>
          <div class="cat-age">🎂 ${cat.age} year${cat.age !== 1 ? 's' : ''} old</div>
          <div class="cat-footer">
            <button class="btn btn-danger" onclick="deleteCat(${cat.id})">Remove</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // ── Update stats ───────────────────────────────────────
  function updateStats(cats) {
    document.getElementById('totalCats').textContent   = cats.length;
    const breeds = [...new Set(cats.map(c => c.breed))];
    document.getElementById('totalBreeds').textContent = breeds.length;
  }

  // ── Toast ──────────────────────────────────────────────
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className   = `toast ${type} show`;
    setTimeout(() => toast.className = 'toast', 3000);
  }

  // ── CSV Upload ──────────────────────────────────────────
  async function uploadCSV() {
    const file   = document.getElementById('csvFile').files[0];
    const status = document.getElementById('csvStatus');

    if (!file) {
      status.textContent = '⚠️ Please select a CSV file first';
      status.style.color = 'var(--pink)';
      return;
    }

    const text    = await file.text();
    const lines   = text.trim().split('\n');
    const headers = lines[0].toLowerCase().split(',').map(h => h.trim());

    const required = ['name', 'breed', 'age'];
    const missing  = required.filter(r => !headers.includes(r));
    if (missing.length > 0) {
      status.textContent = `⚠️ Missing columns: ${missing.join(', ')}`;
      status.style.color = 'var(--pink)';
      return;
    }

    const cats = [];
    for (let i = 1; i < lines.length; i++) {
      const values = lines[i].split(',').map(v => v.trim());
      if (values.length < 3) continue;
      cats.push({
        name:     values[headers.indexOf('name')],
        breed:    values[headers.indexOf('breed')],
        age:      parseInt(values[headers.indexOf('age')]),
        photoUrl: headers.includes('photourl') ? values[headers.indexOf('photourl')] : ''
      });
    }

    if (cats.length === 0) {
      status.textContent = '⚠️ No valid cats found in CSV';
      status.style.color = 'var(--pink)';
      return;
    }

    status.textContent = `⏳ Uploading ${cats.length} cats...`;
    status.style.color = 'var(--muted)';

    try {
      const res = await fetch('/api/cats/bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cats)
      });

      if (res.ok) {
        status.textContent = `✅ Successfully added ${cats.length} cats!`;
        status.style.color = 'var(--green)';
        document.getElementById('csvFile').value = '';
        loadCats();
      } else {
        status.textContent = '❌ Upload failed. Try again.';
        status.style.color = 'var(--pink)';
      }
    } catch {
      status.textContent = '❌ Could not connect to server';
      status.style.color = 'var(--pink)';
    }
  }

  // ── Download sample CSV ─────────────────────────────────
  function downloadSample() {
    const csv = `name,breed,age,photoUrl
Whiskers,Persian,2,https://upload.wikimedia.org/wikipedia/commons/1/15/White_Persian_Cat.jpg
Luna,Siamese,3,https://upload.wikimedia.org/wikipedia/commons/2/25/Siam_lilacpoint.jpg
Oliver,Maine Coon,4,https://upload.wikimedia.org/wikipedia/commons/5/5f/Maine_Coon_cat_by_Tomitheos.JPG
Mochi,Scottish Fold,1,https://upload.wikimedia.org/wikipedia/commons/5/5d/SC_Felicia_3.jpg
Bella,Bengal,2,https://upload.wikimedia.org/wikipedia/commons/b/ba/Paintedcats_Red_Star_standing.jpg
Simba,Ragdoll,5,https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Ragdoll_from_Gatil_Ragbelas.jpg/320px-Ragdoll_from_Gatil_Ragbelas.jpg
Nala,Sphynx,3,https://upload.wikimedia.org/wikipedia/commons/a/af/Sphynx1_feb_2006.jpg
Leo,British Shorthair,4,https://upload.wikimedia.org/wikipedia/commons/9/9d/Britishblue.jpg
Cleo,Abyssinian,2,https://upload.wikimedia.org/wikipedia/commons/9/9b/Gustav_chocolate.jpg
Shadow,Norwegian Forest,6,https://upload.wikimedia.org/wikipedia/commons/b/b7/Norwegian_Forest_Cat_waiting_for_dinner.jpg`;

    const blob = new Blob([csv], { type: 'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'sample-cats.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  // Init
  loadCats();
</script>
